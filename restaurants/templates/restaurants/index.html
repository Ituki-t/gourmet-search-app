{% extends 'base.html' %}

{% block title %}レストラン検索アプリ{% endblock title %}

{% block content %}

<div class="container">
    <h1>レストラン一覧</h1>
    {% for restaurant in restaurants %}
        <div class="card mb-3" style="max-width: 540px;">
            <a href="{% url 'detail' restaurant.id %}" class="text-decoration-none text-dark">
            <div class="row g-0">
                <div class="col-md-4">
                <img src="{{ restaurant.photo }}" class="img-fluid rounded-start" alt="{{ restaurant.name }}">
                </div>
                <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">{{ restaurant.name }}</h5>
                    <p class="card-text">{{ restaurant.access }}</p>
                    <!-- <p class="card-text">{{ restaurant.address }}</p> -->
                    <!-- <p class="card-text">{{ restaurant.genre }}</p> -->
                    <p class="card-text">予算: {{ restaurant.budget }}</p>
                    <p class="card-text"><small class="text-body-secondary">{{ restaurant.genre }}</small></p>
                </div>
                </div>
            </div>
            </a>
        </div>

    {% endfor %}
</div>

{% endblock content %}
